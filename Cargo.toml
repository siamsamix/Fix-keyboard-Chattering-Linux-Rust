[package]
name = "keyboard-chattering-fix"
version = "0.1.0"
edition = "2021"
description = "Filters mechanical keyboard chattering on Linux using evdev and uinput"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
evdev = "0.13"
libc = "0.2"
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
